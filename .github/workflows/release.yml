name: Release

# Builds the Windows game and publishes it on GitHub Releases: an installer (Setup.exe) and a portable zip, with the
# changelog section as the release notes. RELEASING.md explains the steps; only the owner releases. From the owner's
# katanashotgun and Airsoft-Next projects.
# Versions are named the way players see them ("0.1 Dev 1") and tagged v0.1-dev.1 (tools/version.sh). A release is
# the version in project.godot (config/version), with its own section in CHANGELOG.md: the release pull request sets
# both first (RELEASING.md), and publishing stops before building if either is missing. The version is written into
# the build (the game's config/version and the exe's version number). Three ways in:
#  - push a tag like v0.1-dev.1 on main: releases that version
#  - Actions tab -> Release -> Run workflow on main with "Publish" ticked: releases the version in project.godot and
#    creates its tag
#  - Run workflow with "Publish" unticked (optionally building as another version), or a pull request that touches the
#    release pipeline: a dry run that builds and tests everything and publishes nothing (the downloads are in the
#    run's Artifacts)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Dry runs only: build as this version, like 0.1 Dev 2 (empty: config/version in project.godot)"
        required: false
        default: ""
      publish:
        description: "Publish the GitHub Release and create its tag (untick for a dry run)"
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/actions/**"
      - "installer/**"
      - "export_presets.cfg"
      - "project.godot"
      - "icon.svg"
      - "tools/version.sh"
      - "tools/changelog_section.sh"
      - "tools/changelog.sh"
      - "tools/make_icon.gd"
      - "tools/make_notices.gd"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2" # must match project.godot (config/features) and ci.yml
  GODOT_STATUS: "stable"

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      tag: ${{ steps.v.outputs.tag }}
      number: ${{ steps.v.outputs.number }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tags and main, for the checks below

      - id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push)              OUT=$(tools/version.sh "$GITHUB_REF_NAME"); PUBLISH=true ;;
            workflow_dispatch) if [ -n "$INPUT_VERSION" ]; then OUT=$(tools/version.sh "$INPUT_VERSION"); else OUT=$(tools/version.sh); fi
                               PUBLISH="$INPUT_PUBLISH" ;;
            *)                 OUT=$(tools/version.sh); PUBLISH=false ;;
          esac
          NAME=$(sed -n 's/^name=//p' <<< "$OUT")
          TAG=$(sed -n 's/^tag=//p' <<< "$OUT")
          if [ "$EVENT" = "push" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::The tag $GITHUB_REF_NAME isn't in the release form: '$NAME' is tagged $TAG (RELEASING.md)."; exit 1
          fi
          if [ "$PUBLISH" = "true" ]; then
            # Everything below is checked before the long build, so a release that would come out wrong never starts.
            if [ "$EVENT" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Releases are published from main. Pick main in 'Use workflow from', or untick Publish for a dry run (RELEASING.md)."; exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Releases are made from main, and this commit isn't on main. Tag a commit on main (RELEASING.md)."; exit 1
            fi
            if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
              echo "::error::A typed version is for dry runs only. To publish, leave it empty: the release is the version in project.godot (RELEASING.md)."; exit 1
            fi
            SOURCE=$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)
            if [ "$SOURCE" != "$NAME" ]; then
              echo "::error::project.godot on this commit says '$SOURCE', not '$NAME'. Merge the release pull request that sets config/version first (RELEASING.md)."; exit 1
            fi
            if ! awk -v h="## $NAME" '$0 == h || index($0, h " (") == 1 { f = 1 } END { exit !f }' CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## $NAME' section for the release notes. Merge the release pull request that runs tools/changelog.sh release first (RELEASING.md)."; exit 1
            fi
            if [ "$EVENT" = "workflow_dispatch" ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::$NAME ($TAG) has already been released. Set the next version in project.godot first (RELEASING.md)."; exit 1
            fi
          fi
          echo "$OUT" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          { echo "Version $NAME, publish=$PUBLISH"; echo '```'; echo "$OUT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  export:
    name: Test and export
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAME: ${{ needs.version.outputs.name }}
      NUMBER: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v6

      - name: Write the version into the build
        run: |
          set -euo pipefail
          sed -i "s/^config\/version=\".*\"$/config\/version=\"$NAME\"/" project.godot
          grep -qx "config/version=\"$NAME\"" project.godot
          sed -i -e "s/^application\/file_version=\".*\"$/application\/file_version=\"$NUMBER\"/" \
                 -e "s/^application\/product_version=\".*\"$/application\/product_version=\"$NUMBER\"/" export_presets.cfg
          grep -qx "application/file_version=\"$NUMBER\"" export_presets.cfg
          grep -qx "application/product_version=\"$NUMBER\"" export_presets.cfg

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          status: ${{ env.GODOT_STATUS }}
          templates: "true"

      - name: Smoke test (no script errors allowed)
        run: tools/smoke_test.sh

      - name: Make the icon and the licence notices
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tools/make_icon.gd
          godot --headless --path . -s res://tools/make_notices.gd
          test -s build/release/icon.ico
          test -s build/release/THIRD_PARTY_NOTICES.txt

      - name: Export for Windows
        run: |
          set -euo pipefail
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/ProjectPraesepe.exe 2>&1 | tee export.log
          test -s build/windows/ProjectPraesepe.exe
          # The installer and the zip take the exe alone (the game is packed inside it): anything else the export
          # starts writing would be left out, so stop here instead.
          if [ "$(ls -A build/windows)" != "ProjectPraesepe.exe" ]; then
            ls -la build/windows; echo "::error::The export wrote more than the exe; installer/ProjectPraesepe.iss and the zip need to ship it too"; exit 1
          fi
          if grep -E "^ERROR:|Invalid version" export.log; then
            echo "::error::The export had errors (see export.log)"; exit 1
          fi
          ls -la build/*

      - name: Check the exported game plays like the project
        run: |
          set -uo pipefail
          # The game packed inside the exe, run here: it must fly the same smoke run to exactly the same place.
          mkdir -p "$RUNNER_TEMP/exported" && cd "$RUNNER_TEMP/exported"
          timeout 180 godot --headless --main-pack "$GITHUB_WORKSPACE/build/windows/ProjectPraesepe.exe" --fixed-fps 60 \
            -- --smoke --seed 1234 > exported.log 2>&1
          cp exported.log "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|^ERROR:" exported.log \
             | grep -vE "leaked at exit|instances were leaked|resources still in use at exit"; then
            echo "::error::The exported game has errors (see exported.log)"; exit 1
          fi
          if [ "$(grep "^SMOKE: ok" exported.log)" != "$(grep "^SMOKE: ok" smoke.log)" ]; then
            tail -20 exported.log
            echo "::error::The exported game didn't finish the smoke run the same way as the project"; exit 1
          fi
          grep "^SMOKE: ok" exported.log

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: export-logs
          path: |
            import.log
            smoke.log
            smoke.log.again
            export.log
            exported.log
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: builds
          path: |
            build/windows/
            build/release/
          retention-days: 7

  installer:
    name: Windows installer
    needs: [version, export]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NAME: ${{ needs.version.outputs.name }}
      TAG: ${{ needs.version.outputs.tag }}
      NUMBER: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: builds
          path: build

      - name: Build the installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup (ISCC.exe) not found" }
          Write-Host "Using $($iscc.FullName)"
          & $iscc.FullName "/DAppVersion=$env:NAME" "/DAppTag=$env:TAG" "/DAppNumber=$env:NUMBER" installer\ProjectPraesepe.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist

      - name: Check the installer installs, the game plays, and it uninstalls
        shell: pwsh
        run: |
          $setup = "dist\ProjectPraesepe-$env:TAG-Windows-Setup.exe"
          $dir = "$env:RUNNER_TEMP\PraesepeTest"
          $exe = "$dir\ProjectPraesepe.exe"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          if (-not (Test-Path $exe)) { throw "game exe missing after install" }
          if (-not (Test-Path "$dir\THIRD_PARTY_NOTICES.txt")) { throw "licence notices missing after install" }
          $version = (Get-Item $exe).VersionInfo.FileVersion
          if ($version -ne $env:NUMBER) { throw "the game exe says version '$version', expected $env:NUMBER" }

          # The installed game, as a player would start it, flies the whole smoke run on Windows.
          $log = "$env:RUNNER_TEMP\installed.log"
          $game = Start-Process $exe -ArgumentList "--headless", "--fixed-fps", "60", "--log-file", $log, "--", "--smoke", "--seed", "1234" -PassThru
          $null = $game.Handle # keeps the process handle, without which PowerShell loses the exit code
          if (-not $game.WaitForExit(300000)) { $game.Kill(); throw "the installed game didn't finish the smoke run in 5 minutes" }
          if (-not (Test-Path $log)) { throw "the installed game wrote no log (exit code $($game.ExitCode))" }
          Copy-Item $log installed.log
          $errors = Select-String -CaseSensitive -Path $log -Pattern "SCRIPT ERROR|Parse Error|Failed to load script|^ERROR:" |
            Where-Object { $_.Line -notmatch "leaked at exit|instances were leaked|resources still in use at exit" }
          if ($errors) { $errors | ForEach-Object { Write-Host $_.Line }; throw "the installed game has errors (see installed.log)" }
          $ok = Select-String -CaseSensitive -Path $log -Pattern "^SMOKE: ok"
          if (-not $ok) { Get-Content $log -Tail 20; throw "the installed game never finished the smoke run" }
          if ($game.ExitCode -ne 0) { Get-Content $log -Tail 20; throw "the installed game exited with code $($game.ExitCode)" }
          Write-Host $ok.Line

          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exit code $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "game exe still there after uninstall" }
          Write-Host "Install, play and uninstall OK"

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-log
          path: installed.log
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/*.exe
          retention-days: 7

  release:
    name: Package and publish
    needs: [version, export, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NAME: ${{ needs.version.outputs.name }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # release notes fall back to changelog.d/, ordered by history

      - uses: actions/download-artifact@v8
        with:
          name: builds
          path: art/builds

      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: art/installer

      - name: Package the downloads
        run: |
          set -euo pipefail
          mkdir -p dist
          cp art/installer/*.exe dist/
          # The portable zip carries the licences next to the game, like the installer.
          ZIP="$GITHUB_WORKSPACE/dist/ProjectPraesepe-${TAG}-Windows-Portable.zip"
          (cd art/builds/windows && zip -9 "$ZIP" ProjectPraesepe.exe)
          zip -9 -j "$ZIP" art/builds/release/THIRD_PARTY_NOTICES.txt
          unzip -l "$ZIP" | grep -q THIRD_PARTY_NOTICES.txt
          ls -la dist

      - name: Release notes from the changelog
        run: tools/changelog_section.sh "$NAME" > release_notes.md; cat release_notes.md

      - name: Keep the packaged downloads (dry runs too)
        uses: actions/upload-artifact@v7
        with:
          name: ProjectPraesepe-${{ env.TAG }}
          path: |
            dist/*
            release_notes.md
          retention-days: 14

      - name: Publish the GitHub Release
        if: needs.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Project Praesepe ${{ env.NAME }}
          body_path: release_notes.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: dist/*
