name: Set up Godot
description: Installs the pinned Godot editor (and optionally the desktop export templates), cached between runs.

inputs:
  version:
    description: Godot version, e.g. 4.7.2. Must match the project.
    required: true
  status:
    description: Release status, e.g. stable.
    default: stable
  templates:
    description: Also install the Windows, Linux and macOS export templates.
    default: "false"

runs:
  using: composite
  steps:
    - name: Cache Godot downloads
      uses: actions/cache@v5
      with:
        path: ~/.cache/godot-dl
        key: godot-${{ inputs.version }}-${{ inputs.status }}-tpl-${{ inputs.templates }}

    - name: Install Godot
      shell: bash
      env:
        GV: ${{ inputs.version }}
        GS: ${{ inputs.status }}
        WANT_TEMPLATES: ${{ inputs.templates }}
      run: |
        set -euo pipefail
        V="${GV}-${GS}"
        BASE="https://github.com/godotengine/godot/releases/download/${V}"
        DL="$HOME/.cache/godot-dl"
        mkdir -p "$DL"
        if [ ! -f "$DL/Godot_v${V}_linux.x86_64" ]; then
          curl -fsSL --retry 4 -o "$DL/godot.zip" "${BASE}/Godot_v${V}_linux.x86_64.zip"
          unzip -q -o "$DL/godot.zip" -d "$DL"
          rm "$DL/godot.zip"
        fi
        sudo install -m 755 "$DL/Godot_v${V}_linux.x86_64" /usr/local/bin/godot
        godot --headless --version
        if [ "$WANT_TEMPLATES" = "true" ]; then
          # Only the three desktop templates are kept (the full archive is 1.3 GB).
          if [ ! -f "$DL/templates/windows_release_x86_64.exe" ]; then
            curl -fsSL --retry 4 -o "$DL/templates.tpz" "${BASE}/Godot_v${V}_export_templates.tpz"
            unzip -q -o "$DL/templates.tpz" -d "$DL" \
              templates/windows_release_x86_64.exe templates/linux_release.x86_64 \
              templates/macos.zip templates/version.txt
            rm "$DL/templates.tpz"
          fi
          TPL="$HOME/.local/share/godot/export_templates/${GV}.${GS}"
          mkdir -p "$TPL"
          cp "$DL"/templates/* "$TPL/"
          ls -la "$TPL"
        fi
